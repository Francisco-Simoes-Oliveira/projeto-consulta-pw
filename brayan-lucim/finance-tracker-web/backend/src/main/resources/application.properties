spring.application.name=finance-tracker-api
spring.config.import=optional:classpath:application-secrets.properties

management.endpoints.web.exposure.include=health

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:3600000}
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:brayanbarrosdm@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
