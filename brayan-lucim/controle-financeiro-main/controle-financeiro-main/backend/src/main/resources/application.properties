spring.config.import=optional:file:./src/main/resources/application-secrets.properties

spring.application.name=backend

# Banco de Dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fincontrol}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Configurações de JWT
jwt.secret=${JWT_SECRET:string_de_pelo_menos_32_caracteres}
jwt.expiration=86400000

# Configuração de Envio de E-mail (JavaMailSender / Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seu-email-real@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha-de-app-de-16-digitos}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true