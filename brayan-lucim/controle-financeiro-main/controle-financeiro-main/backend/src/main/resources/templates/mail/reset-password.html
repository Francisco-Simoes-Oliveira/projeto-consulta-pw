<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Recuperação de Senha</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #1a1d24; color: #ffffff; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #222630; padding: 30px; border-radius: 16px;">
        <h2 style="color: #6c63ff;">FinControl</h2>
        <p>Olá, <strong th:text="${userName}">Usuário</strong>!</p>
        <p>Recebemos uma solicitação para redefinir a senha da sua conta.</p>
        <p>Clique no botão abaixo para definir uma nova senha. O link é válido por 1 hora:</p>
        <div style="text-align: center; margin: 30px 0;">
            <a th:href="${resetLink}"
                style="background-color: #6c63ff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold;">Redefinir
                Senha</a>
        </div>
        <p style="font-size: 12px; color: #9ca3af;">Se você não solicitou essa alteração, ignore este e-mail.</p>
    </div>
</body>

</html>
