# Exemplo de application.properties SEM segredo escrito no código.
# O ${NOME_DA_VARIAVEL} é lido das variáveis de ambiente da máquina/servidor.
# Depois do ":" vem o valor padrão, usado quando a variável não existe (só para local).

spring.application.name=financas

# ---- Banco ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (sem valor padrão de propósito: a aplicação nem sobe sem a variável) ----
jwt.secret=${JWT_SECRET}
jwt.expiracao-ms=3600000

# ---- IA (pasta 05) ----
gemini.api-key=${GEMINI_API_KEY}
gemini.modelo=gemini-2.5-flash

# ---- Erros: não vaze stack trace para o cliente ----
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Cookie seguro (só importa se você usar sessão/cookie) ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# No .gitignore do backend, acrescente:
#   .env
#   application-secrets.properties
