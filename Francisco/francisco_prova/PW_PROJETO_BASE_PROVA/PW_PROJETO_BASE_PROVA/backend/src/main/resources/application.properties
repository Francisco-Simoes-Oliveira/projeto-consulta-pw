spring.application.name=prova-base
server.port=8080

# Banco H2: não exige instalar MySQL/Postgres na prova.
spring.datasource.url=jdbc:h2:file:./data/provabase;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Troque em produção por uma variável de ambiente.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-super-secreta-com-pelo-menos-32-caracteres-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
